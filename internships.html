<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internhub | Internships</title>
<meta name="description" content="Search internships by location, category and experience on Internhub." />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/navbar.css" />
<link rel="stylesheet" href="css/footer.css" />
<link rel="stylesheet" href="css/hero.css" />
<link rel="stylesheet" href="css/cards.css" />
<link rel="stylesheet" href="css/forms.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="internships">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <header class="page-header">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span>Internships</nav>
      <h1>Find internships that kickstart your career.</h1>
      <p>Hands-on roles designed for students and recent graduates.</p>
    </div>
  </header>

  <section class="section--tight">
    <div class="container">
      <form id="job-search-form" class="search-ticket" style="margin:0 0 2rem;max-width:none">
        <div style="display:grid;grid-template-columns:1.4fr auto 1fr auto;align-items:center">
          <div class="ticket-field">
            <label for="filter-search">What</label>
            <input type="text" id="filter-search" placeholder="Job title, skills or company" />
          </div>
          <div class="ticket-divider"></div>
          <div class="ticket-field">
            <label for="filter-location">Where</label>
            <select id="filter-location">
              <option value="">Any location</option>
              <option>Mumbai</option><option>Pune</option><option>Bengaluru</option>
              <option>Hyderabad</option><option>Delhi</option><option>Chennai</option><option>Remote</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <button type="button" id="mobile-filter-toggle" class="btn btn-outline btn-block mobile-filter-toggle" style="margin-bottom:1rem">Show filters</button>

      <div class="jobs-layout" style="display:grid;grid-template-columns:260px 1fr;gap:2rem;align-items:start">
        <aside class="filter-panel" id="filter-panel">
          <h2>Filters</h2>
          <div class="filter-group">
            <h3>Job type</h3>
            <label class="filter-option"><input type="checkbox" data-filter-type value="Full Time" /> Full Time</label>
            <label class="filter-option"><input type="checkbox" data-filter-type value="Part Time" /> Part Time</label>
            <label class="filter-option"><input type="checkbox" data-filter-type value="Internship" /> Internship</label>
            <label class="filter-option"><input type="checkbox" data-filter-type value="Contract" /> Contract</label>
          </div>
          <div class="filter-group">
            <h3>Category</h3>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Software Development" /> Software Development</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Data Science" /> Data Science</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="UI/UX Design" /> UI/UX Design</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Marketing" /> Marketing</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Finance" /> Finance</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Human Resources" /> Human Resources</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Product" /> Product</label>
            <label class="filter-option"><input type="checkbox" data-filter-category value="Cybersecurity" /> Cybersecurity</label>
          </div>
          <div class="filter-group">
            <h3>Experience</h3>
            <label class="filter-option"><input type="checkbox" data-filter-experience value="0-1 years" /> 0–1 years</label>
            <label class="filter-option"><input type="checkbox" data-filter-experience value="1-3 years" /> 1–3 years</label>
            <label class="filter-option"><input type="checkbox" data-filter-experience value="2-4 years" /> 2–4 years</label>
          </div>
          <button type="button" id="clear-filters" class="btn btn-outline btn-block btn-sm">Clear filters</button>
        </aside>

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.75rem">
            <p id="results-count" class="text-muted" style="margin:0">Loading…</p>
            <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem">Sort
              <select id="filter-sort" style="padding:0.4rem 0.6rem;border:1px solid var(--color-border);border-radius:8px">
                <option value="relevant">Relevant</option>
                <option value="newest">Newest</option>
              </select>
            </label>
          </div>
          <div class="grid grid-3" id="job-results"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/jobcard.js"></script>
<script src="js/main.js"></script>
<script src="js/jobs.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => initJobsListPage({ internshipOnly: true }));
</script>
</body>
</html>
