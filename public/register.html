<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | InternHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body style="background: var(--color-background); min-height: 100vh; display: flex; flex-direction: column;">

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">Intern<span>Hub</span></a>
  </div>
</nav>

<div class="container flex-1">
  <div class="form-card" style="max-width: 500px;">
    <h1 class="form-card-title">Create an Account</h1>
    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-input">
          <input type="password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="password-toggle">Show</button>
        </div>
        <span class="form-hint">Must be at least 8 characters.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label class="form-label">I am a...</label>
        <select class="form-control" required>
          <option value="student">Student / Job Seeker</option>
          <option value="employer">Employer / Recruiter</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem;">Register</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; color: var(--color-muted);">
      Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 500;">Login here</a>
    </div>
  </div>
</div>

</body>
</html>
