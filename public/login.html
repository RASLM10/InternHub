<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | InternHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body style="background: var(--color-background); min-height: 100vh; display: flex; flex-direction: column;">

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-logo">Intern<span>Hub</span></a>
  </div>
</nav>

<div class="container flex-1" style="flex:1;">
  <div class="form-card">
    <h1 class="form-card-title">Welcome Back</h1>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-input">
          <input type="password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="password-toggle">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 1rem;">Login</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; color: var(--color-muted);">
      Don't have an account? <a href="register.html" style="color: var(--color-primary); font-weight: 500;">Register here</a>
    </div>
  </div>
</div>

</body>
</html>
