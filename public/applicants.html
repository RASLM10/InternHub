<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="View applicants for your posted jobs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/css/style.css">

        <a href="/internships.html" class="nav-link">Internships</a>
        <a href="/companies.html" class="nav-link">Companies</a>
        <a href="/about.html" class="nav-link">About</a>
        <a href="/contact.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-auth" id="nav-auth">
        <a href="/login.html" class="btn btn-outline">Login</a>
        <a href="/register.html" class="btn btn-primary">Get Started</a>
      </div>
      <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>

    <div class="mobile-nav" id="mobile-nav">
      <a href="/jobs.html" class="nav-link">Jobs</a>

      </div>
    </div>

      </nav>
    </aside>

    <main class="dashboard-main">
      <h1 class="mb-4">Applicants</h1>
      
      <div class="card p-3 mb-4 d-flex align-items-center gap-3">
        <label for="job-selector" class="mb-0 fw-bold">Select Job:</label>
        <select id="job-selector" class="form-control w-auto flex-grow-1">
          <option value="">All Jobs</option>
          <!-- Loaded by JS -->
        </select>
      </div>

      <div id="applicants-container" class="applications-list">
        <!-- Rendered by JS -->
        <p>Loading applicants...</p>
      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom text-center">
        <p>&copy; 2026 InternHub. All rights reserved.</p>
